<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" role="img" aria-labelledby="t d"><title id="t">Bancada laser com leitura óptica</title><desc id="d">Laser, material, atenuador ND e detector dentro de gabinete opaco. Tensão segue para ADS1115, ESP32 e PWA. Emissão depende da chave geral, tampa e botão físico, não do software.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5-7 3.5" fill="#77b5a0"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5-7 3.5" fill="#e1817a"/></marker></defs><rect width="1060" height="440" rx="20" fill="#f2f6f0"/><g font-family="Arial,sans-serif"><rect x="24" y="20" width="1012" height="222" rx="18" fill="#143e35"/><text x="48" y="52" fill="#aed1bd" font-size="12" letter-spacing="1.5">GABINETE OPACO · CAMINHO ÓPTICO CONTIDO</text><path d="M195 140H803" stroke="#e66b63" stroke-width="3" marker-end="url(#b)"/><g fill="#f4f9f3" font-size="17" font-weight="bold"><rect x="50" y="94" width="152" height="90" rx="14" fill="#356457"/><text x="126" y="124" text-anchor="middle">Módulo laser</text><text x="126" y="150" text-anchor="middle" fill="#bcd6ca" font-size="12" font-weight="normal">650–655 nm · ≤ 1 mW</text><rect x="297" y="94" width="150" height="90" rx="14" fill="#3f6452"/><text x="372" y="124" text-anchor="middle">Material</text><text x="372" y="150" text-anchor="middle" fill="#c5d7cb" font-size="12" font-weight="normal">inerte · suporte fixo</text><rect x="541" y="94" width="150" height="90" rx="14" fill="#356457"/><text x="616" y="124" text-anchor="middle">Filtro ND</text><text x="616" y="150" text-anchor="middle" fill="#c5d7cb" font-size="12" font-weight="normal">atenuação óptica</text><rect x="785" y="94" width="224" height="90" rx="14" fill="#356457"/><text x="897" y="124" text-anchor="middle">OPT101</text><text x="897" y="150" text-anchor="middle" fill="#c5d7cb" font-size="12" font-weight="normal">fotodiodo + amplificador</text></g><text x="49" y="216" fill="#a8c4b7" font-size="12">Anteparos e terminador de feixe contêm reflexões. O desenho mostra o fluxo; não é um gabinete certificado.</text><path d="M897 184V271" stroke="#77b5a0" stroke-width="2.5" marker-end="url(#a)"/><text x="920" y="259" fill="#4e7460" font-size="11">tensão</text><g fill="#edf4eb" stroke="#bfd5c3"><rect x="781" y="281" width="228" height="65" rx="12"/><rect x="515" y="281" width="212" height="65" rx="12"/><rect x="250" y="281" width="210" height="65" rx="12"/></g><g fill="#245644" font-size="16" font-weight="bold" text-anchor="middle"><text x="895" y="308">ADS1115</text><text x="621" y="308">ESP32</text><text x="355" y="308">PWA</text></g><g fill="#688273" font-size="12" text-anchor="middle"><text x="895" y="329">conversão de tensão</text><text x="621" y="329">tempo e estados</text><text x="355" y="329">captura e armazenamento</text></g><path d="M780 314H735M514 314H468" stroke="#77b5a0" stroke-width="2.5" marker-end="url(#a)"/><text x="755" y="300" text-anchor="middle" fill="#4e7460" font-size="10">I2C</text><text x="488" y="300" text-anchor="middle" fill="#4e7460" font-size="10">USB</text><rect x="24" y="370" width="1012" height="47" rx="12" fill="#e2eadd"/><text x="44" y="391" fill="#375b46" font-size="12" font-weight="bold">EMISSÃO MANUAL</text><text x="44" y="407" fill="#59735e" font-size="11">Fonte 3,0 V → chave geral → contato NO da tampa → botão momentâneo → laser. O programa só lê dados.</text><text x="47" y="286" fill="#758974" font-size="10">ESQUEMA FUNCIONAL</text><text x="47" y="302" fill="#758974" font-size="10">FORA DE ESCALA</text></g></svg>
